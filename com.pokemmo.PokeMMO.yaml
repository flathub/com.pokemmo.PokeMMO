app-id: com.pokemmo.PokeMMO
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
separate-locales: false
command: pokemmo.sh
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --share=network
  - --device=all
  - --socket=pulseaudio
  - --env=PATH=/app/bin:/usr/bin
  - --env=__GL_THREADED_OPTIMIZATIONS=0
modules:
  - name: PokeMMO
    buildsystem: simple
    only-arches: [x86_64, aarch64]
    build-commands:
      - |
        if [ "$FLATPAK_ARCH" = "aarch64" ]; then
          install -Dm755 linux/arm64/PokeMMO-Updater /app/bin/launcher
        else
          install -Dm755 linux/x64/PokeMMO-Updater /app/bin/launcher
        fi
      - install -D pokemmo.sh /app/bin/pokemmo.sh
      - |
        for size in 16x16 22x22 24x24 32x32 48x48 64x64 128x128 256x256 512x512; do
          install -Dm644 icon_${size}.png /app/share/icons/hicolor/${size}/apps/com.pokemmo.PokeMMO.png
        done
      - |
        for size in 24x24 32x32 48x48 64x64 128x128 256x256 512x512; do
          install -Dm644 icon_settings_${size}.png /app/share/icons/hicolor/${size}/apps/com.pokemmo.PokeMMO.Settings.png
        done
      - install -Dp -m 644 com.pokemmo.PokeMMO.desktop /app/share/applications/com.pokemmo.PokeMMO.desktop
      - install -Dp -m 644 com.pokemmo.PokeMMO.Settings.desktop /app/share/applications/com.pokemmo.PokeMMO.Settings.desktop
      - install -Dm644 -t /app/share/metainfo com.pokemmo.PokeMMO.metainfo.xml
    sources:
      - type: archive
        url: https://github.com/PokeMMO/pokemmo-launcher/releases/download/v4.0f/build.zip
        sha256: 5a69e1f7320de69e8e40786d400c55c397dec9bbec942b34ba37135488d8878f
        strip-components: 0
        x-checker-data:
          type: json
          url: https://api.github.com/repos/PokeMMO/pokemmo-launcher/releases/latest
          # Some upstream tags carry a v prefix and some do not, so strip it for
          # the version and read the asset URL off the release rather than
          # rebuilding it from the tag.
          version-query: .tag_name | sub("^v"; "")
          url-query: .assets[] | select(.name == "build.zip") | .browser_download_url
          timestamp-query: .published_at
          is-main-source: true
      - type: file
        path: static/pokemmo.sh
      - type: file
        path: static/com.pokemmo.PokeMMO.desktop
      - type: file
        path: static/com.pokemmo.PokeMMO.Settings.desktop
      - type: file
        path: icons/icon_16x16.png
      - type: file
        path: icons/icon_22x22.png
      - type: file
        path: icons/icon_24x24.png
      - type: file
        path: icons/icon_32x32.png
      - type: file
        path: icons/icon_48x48.png
      - type: file
        path: icons/icon_64x64.png
      - type: file
        path: icons/icon_128x128.png
      - type: file
        path: icons/icon_256x256.png
      - type: file
        path: icons/icon_512x512.png
      - type: file
        path: icons/icon_settings_24x24.png
      - type: file
        path: icons/icon_settings_32x32.png
      - type: file
        path: icons/icon_settings_48x48.png
      - type: file
        path: icons/icon_settings_64x64.png
      - type: file
        path: icons/icon_settings_128x128.png
      - type: file
        path: icons/icon_settings_256x256.png
      - type: file
        path: icons/icon_settings_512x512.png
      - type: file
        path: com.pokemmo.PokeMMO.metainfo.xml
